name: Beta

# 内测渠道：main 每次推送自动构建桌面端，发成 GitHub 预发布（永不标 Latest），只保留最近 5 个。
# 版本号 <package.json 的下一个 patch>-beta.<N> 只在 CI 里算，不提交回仓库；
# N 是 HEAD 相对当前正式版 tag 的 first-parent 提交数，每个正式版之后从 1 重新数（见 scripts/beta-release.mjs）。
# 正式版仍由手动推 vX.Y.Z tag 走 Build；预发布 tag 不触发 Build / Publish Server / Relay Docker。
# 服务端 npm 预发布版本随桌面内测同一版本号发到 @ensocode/server 的 beta dist-tag（不动 latest），版本号规则与桌面内测一致；发布失败不影响桌面内测。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # server-npm 经 workflow_call 复用 publish-server.yml（声明了 id-token: write）。
  # 可复用工作流的 id-token 权限按调用方授权裁决：调用方没声明时 GitHub 在启动期直接
  # 判 startup_failure，整个 workflow 一个 job 都起不来（actionlint 查不出，已在临时仓库复现验证）。
  id-token: write

jobs:
  prepare:
    # 发版提交本身就是正式版内容，不再出 beta
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release)')
    # prepare -> verify -> desktop 严格串行并共用 beta-build：新推送立刻取消旧轮次的构建，
    # 而 release 放在独立且 cancel-in-progress: false 的 beta-release 组，避免发布中途被取消留下残缺预发布。
    concurrency:
      group: beta-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(node scripts/beta-release.mjs version "$RUN_NUMBER")
          STABLE="v${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 对应正式版已打 tag（排队中的旧提交）：这个 beta 比正式版旧，
          # 而内测客户端取 releases.atom 的第一条，会被它挡住看不到正式版，跳过
          if git ls-remote --exit-code --tags origin "refs/tags/$STABLE" >/dev/null; then
            echo "::notice::$STABLE 已发布，跳过 $VERSION"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    concurrency:
      group: beta-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  server-npm:
    needs: [prepare, verify]
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/publish-server.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      dist-tag: beta
      dry-run: false
    secrets: inherit

  desktop:
    needs: [prepare, verify]
    concurrency:
      group: beta-build
      cancel-in-progress: true
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish: never
      release-artifacts: true
    secrets: inherit

  # premium-relay：随 beta 验证通过自动部署阿里云 relay（Go 二进制 + 内嵌 phone/desk 前端）。
  # 与 desktop 并行，不等桌面打包；部署失败不阻塞 beta 发布（release 只 needs desktop）。
  # 服务器地址、账号、路径全部走 secrets，仓库内不出现字面量。
  premium-relay:
    needs: [prepare, verify]
    if: needs.prepare.outputs.skip != 'true'
    # 部署是有副作用的外部操作：独立并发组且不取消进行中的部署，
    # 避免部署到一半被打断留下半新半旧的进程。
    concurrency:
      group: premium-relay-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREMIUM_RELAY_HOST: ${{ secrets.PREMIUM_RELAY_HOST }}
      PREMIUM_RELAY_USER: ${{ secrets.PREMIUM_RELAY_USER }}
      PREMIUM_RELAY_SSH_KEY: ${{ secrets.PREMIUM_RELAY_SSH_KEY }}
      PREMIUM_RELAY_KNOWN_HOSTS: ${{ secrets.PREMIUM_RELAY_KNOWN_HOSTS }}
      PREMIUM_RELAY_PATH: ${{ secrets.PREMIUM_RELAY_PATH }}
      # 名字沿用旧 secret（值不变，仍是 enso-relay），语义已从 pm2 进程名变为 systemd 单元名。
      PREMIUM_RELAY_PM2_NAME: ${{ secrets.PREMIUM_RELAY_PM2_NAME }}
      PREMIUM_RELAY_PUBLIC_URL: ${{ secrets.PREMIUM_RELAY_PUBLIC_URL }}
    steps:
      - name: Skip when secrets are not configured
        id: gate
        run: |
          if [ -z "$PREMIUM_RELAY_HOST" ] || [ -z "$PREMIUM_RELAY_SSH_KEY" ]; then
            echo "::notice::premium-relay secrets 未配置，跳过部署"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v5

      - name: Setup Go
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: packages/relay-go/go.sum

      - name: Get pnpm store directory
        if: steps.gate.outputs.enabled == 'true'
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      # desk-bundle 来自 out/renderer（pnpm build），sync-frontend.sh 会一并内嵌
      - name: Build renderer and embed phone PWA
        if: steps.gate.outputs.enabled == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm build
          ./packages/relay-go/sync-frontend.sh
          test -f packages/relay-go/frontend/sw.js
          test -d packages/relay-go/frontend/desk-bundle

      # 版本号保持 dev（非 semver）：relay 的自动更新只对 semver 版本生效，
      # 注入 beta 版本号会让服务器上的二进制被 GitHub Release 自动更新覆盖。
      - name: Cross-compile linux amd64
        id: build
        if: steps.gate.outputs.enabled == 'true'
        working-directory: packages/relay-go
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -buildmode=exe -ldflags="-s -w" -o dist/enso-relay-linux-amd64 .
          ls -lh dist/enso-relay-linux-amd64
          SHELL_VERSION=$(grep -o "const SHELL_VERSION = '[0-9a-f]*'" frontend/sw.js | grep -o "[0-9a-f]\{16\}")
          [ -n "$SHELL_VERSION" ] || { echo "::error::无法从 sw.js 提取 SHELL_VERSION"; exit 1; }
          echo "SHELL_VERSION=$SHELL_VERSION" >> "$GITHUB_ENV"
          echo "shell_version=$SHELL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PREMIUM_RELAY_SSH_KEY" > ~/.ssh/premium_relay_key
          chmod 600 ~/.ssh/premium_relay_key
          printf '%s\n' "$PREMIUM_RELAY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload binary
        if: steps.gate.outputs.enabled == 'true'
        run: |
          SSH="ssh -i ~/.ssh/premium_relay_key -o BatchMode=yes -o StrictHostKeyChecking=yes"
          $SSH "$PREMIUM_RELAY_USER@$PREMIUM_RELAY_HOST" "mkdir -p '$PREMIUM_RELAY_PATH'"
          scp -i ~/.ssh/premium_relay_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            packages/relay-go/dist/enso-relay-linux-amd64 \
            "$PREMIUM_RELAY_USER@$PREMIUM_RELAY_HOST:$PREMIUM_RELAY_PATH/enso-relay-linux-amd64.new"

      # 远程脚本：备份 → 停止服务 → 原子替换（mv）→ 启动 → 核对 → 失败回滚。
      # 核对项：/healthz ok、/desk 200、sw.js SHELL_VERSION 与本地构建一致。
      - name: Deploy, verify and rollback on failure
        if: steps.gate.outputs.enabled == 'true'
        env:
          EXPECTED_SHELL_VERSION: ${{ steps.build.outputs.shell_version }}
        run: |
          # printf %q 做 shell 转义：值含空格/特殊字符时远程 shell 仍能正确还原
          Q_PATH=$(printf '%q' "$PREMIUM_RELAY_PATH")
          Q_PM2=$(printf '%q' "$PREMIUM_RELAY_PM2_NAME")
          Q_URL=$(printf '%q' "$PREMIUM_RELAY_PUBLIC_URL")
          Q_SWVER=$(printf '%q' "$EXPECTED_SHELL_VERSION")
          ssh -i ~/.ssh/premium_relay_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PREMIUM_RELAY_USER@$PREMIUM_RELAY_HOST" \
            "RELAY_PATH=$Q_PATH SERVICE_NAME=$Q_PM2 PUBLIC_URL=$Q_URL EXPECTED_SHELL_VERSION=$Q_SWVER bash -s" <<'REMOTE_EOF'
          set -euo pipefail
          BIN="$RELAY_PATH/enso-relay-linux-amd64"
          NEW="$BIN.new"
          TS=$(date -u +%Y%m%d%H%M%S)
          BAK="$BIN.bak-$TS"

          verify() {
            local tries=0
            while [ $tries -lt 12 ]; do
              local health desk swver
              health=$(curl -fsS -m 5 "$PUBLIC_URL/healthz" 2>/dev/null || true)
              desk=$(curl -fsS -m 5 -o /dev/null -w '%{http_code}' "$PUBLIC_URL/desk" 2>/dev/null || true)
              swver=$(curl -fsS -m 5 "$PUBLIC_URL/sw.js" 2>/dev/null | grep -o "const SHELL_VERSION = '[0-9a-f]*'" | grep -o '[0-9a-f]\{16\}' || true)
              if echo "$health" | grep -q '"ok":true' && [ "$desk" = "200" ] && [ "$swver" = "$EXPECTED_SHELL_VERSION" ]; then
                return 0
              fi
              tries=$((tries + 1))
              sleep 5
            done
            echo "verify failed: health=$health desk=$desk swver=$swver expected=$EXPECTED_SHELL_VERSION" >&2
            return 1
          }

          [ -f "$NEW" ] || { echo "uploaded binary missing: $NEW" >&2; exit 1; }
          chmod +x "$NEW"

          # 幂等收敛：sw.js 版本已一致说明同一构建已部署，跳过替换与重启
          CUR_SWVER=$(curl -fsS -m 5 "$PUBLIC_URL/sw.js" 2>/dev/null | grep -o "const SHELL_VERSION = '[0-9a-f]*'" | grep -o '[0-9a-f]\{16\}' || true)
          if [ "$CUR_SWVER" = "$EXPECTED_SHELL_VERSION" ]; then
            echo "already at shell version $EXPECTED_SHELL_VERSION, skipping replace"
            rm -f "$NEW"
            exit 0
          fi

          if [ -f "$BIN" ]; then
            cp "$BIN" "$BAK"
          fi

          # 先停止服务再替换：systemctl restart 的 stop 是异步的，旧进程退出前其文件句柄仍持有二进制，
          # 立即 start 会报 Text file busy。显式 stop 等待退出后再 mv 替换，然后 start。
          systemctl stop "$SERVICE_NAME" 2>/dev/null || true
          mv "$NEW" "$BIN"
          sync  # 确保 mv 后的文件系统元数据落盘
          # systemctl start 失败时不要让 set -e 直接终结脚本，走 verify → 回滚路径
          if ! systemctl start "$SERVICE_NAME"; then
            echo "systemctl start failed after replace" >&2
          fi

          if verify; then
            echo "deploy verified: shell=$EXPECTED_SHELL_VERSION"
            # 只保留最近 3 份备份
            ls -1t "$BIN".bak-* 2>/dev/null | tail -n +4 | xargs -r rm -f
            exit 0
          fi

          echo "deploy verification failed, rolling back" >&2
          LATEST_BAK=$(ls -1t "$BIN".bak-* 2>/dev/null | head -n 1 || true)
          if [ -z "$LATEST_BAK" ]; then
            echo "no backup available for rollback" >&2
            exit 1
          fi
          mv "$BIN" "$BIN.failed-$TS" 2>/dev/null || true
          cp "$LATEST_BAK" "$BIN"
          chmod +x "$BIN"
          # 回滚前先确保服务停止（部署路径已 stop，但若 start 部分成功可能仍有进程）
          systemctl stop "$SERVICE_NAME" 2>/dev/null || true
          # 回滚重启失败也要继续走到下面的健康核对，输出真实状态
          if ! systemctl start "$SERVICE_NAME"; then
            echo "systemctl start failed during rollback" >&2
          fi

          # 回滚后只核对服务恢复（旧二进制的 sw.js 版本本来就是旧的）
          RB_HEALTH=$(curl -fsS -m 5 "$PUBLIC_URL/healthz" 2>/dev/null || true)
          RB_DESK=$(curl -fsS -m 5 -o /dev/null -w '%{http_code}' "$PUBLIC_URL/desk" 2>/dev/null || true)
          if echo "$RB_HEALTH" | grep -q '"ok":true' && [ "$RB_DESK" = "200" ]; then
            echo "rollback verified: service restored with $LATEST_BAK" >&2
          else
            echo "rollback verification failed: health=$RB_HEALTH desk=$RB_DESK" >&2
          fi
          exit 1
          REMOTE_EOF

  release:
    needs: [prepare, desktop]
    concurrency:
      group: beta-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: v${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: Download latest-mac.yml artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: latest-mac-*
          path: mac-yml-artifacts

      # electron-builder 的 GitHub provider 不管版本号带不带 beta 都写 latest*.yml；
      # electron-updater 在预发布 tag 上按 tag 里的渠道读 beta*.yml，所以这里合并 mac 双架构并改名。
      # 内测 Release 不带 latest*.yml：稳定版客户端只读标了 Latest 的正式版，本来也不会来这里。
      - name: Assemble update files
        run: |
          set -euo pipefail
          yq -o=json mac-yml-artifacts/latest-mac-arm64/latest-mac.yml > arm64.json
          yq -o=json mac-yml-artifacts/latest-mac-x64/latest-mac.yml > x64.json
          jq --slurpfile x64 x64.json '.files += $x64[0].files' arm64.json | yq -P > assets/beta-mac.yml
          mv assets/latest.yml assets/beta.yml
          mv assets/latest-linux.yml assets/beta-linux.yml
          cat assets/beta-mac.yml
          for yml in beta-mac.yml beta.yml beta-linux.yml; do
            actual=$(yq '.version' "assets/$yml")
            [ "$actual" = "$VERSION" ] || { echo "::error::$yml version=$actual, expected $VERSION"; exit 1; }
          done
          need() {
            n=$(find assets -maxdepth 1 -name "$1" | wc -l)
            [ "$n" -eq "$2" ] || { echo "::error::$1 有 $n 个，应为 $2"; exit 1; }
          }
          need '*.dmg' 2
          need '*.dmg.blockmap' 2
          need '*-mac.zip' 2
          need '*-mac.zip.blockmap' 2
          need '*.exe' 1
          need '*.exe.blockmap' 1
          need '*.AppImage' 1
          need '*.deb' 1
          need 'latest*.yml' 0
          ls -la assets

      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          {
            echo "内测版本（预发布），由 main 上的 ${GITHUB_SHA::7} 自动构建，只推送给在设置里把「更新渠道」选为「内测版」的用户。"
            if [ -n "$PREV" ]; then
              echo
              echo "## 自 $PREV 以来的提交"
              echo
              git log --no-merges --pretty='- %s' "$PREV..HEAD" | head -50
            fi
          } > notes.md
          cat notes.md

      - name: Publish prerelease
        run: |
          # 本组串行不取消：同基线已有不小于本次编号的 beta（重跑同一提交、旧提交乱序）就不再发
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | {tag_name, prerelease, draft}' > releases.jsonl
          newer=$(node scripts/beta-release.mjs superseded "$VERSION" < releases.jsonl)
          if [ -n "$newer" ]; then
            echo "::notice::已有 $newer，跳过 $TAG"
            echo "已有 $newer，跳过 $TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"\(.prerelease) \(.draft)"')
          [ "$state" = "true false" ] || { echo "::error::$TAG prerelease/draft=$state"; exit 1; }
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          case "$latest" in *-*) echo "::error::Latest 变成了预发布 $latest"; exit 1 ;; esac
          echo "已发布 $TAG（预发布），Latest 仍为 $latest" >> "$GITHUB_STEP_SUMMARY"

      # 只删已发布的 vX.Y.Z-beta.N 预发布（连 tag），正式版与草稿不动
      - name: Prune old betas
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | {tag_name, prerelease, draft}' > releases.jsonl
          node scripts/beta-release.mjs prune 5 < releases.jsonl > prune.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "已清理 $tag" >> "$GITHUB_STEP_SUMMARY"
          done < prune.txt
