name: Beta Runner Retry

# GitHub 托管 macOS runner 在高峰期可能连续 15 分钟分配不到机器，导致零步骤 cancelled 并把整轮 Beta 标红。
# 仅当全部异常 job 均为「零步骤 + 未分配 runner + 平台 not acquired by Runner」且未被更新运行取代时，
# 自动触发 rerun-failed-jobs（最多重跑 2 次），绝不重试或掩盖真实构建失败。
on:
  workflow_run:
    workflows: [Beta]
    types: [completed]

concurrency:
  group: beta-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  retry-unacquired:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Retry if runner acquisition failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          MAX_ATTEMPTS: '3'
          RETRY_DELAY_SECONDS: '30'
        run: node scripts/retry-unacquired-run.mjs
