appId: com.j3n5en.enso-code
productName: EnsoCode
directories:
  buildResources: build
files:
  - out/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # 动态 import，收集器可能漏掉；pnpm symlink 也要跟进拷进包
  - from: node_modules/@rahularya01/pi-cursor
    to: node_modules/@rahularya01/pi-cursor
  - from: node_modules/@bufbuild/protobuf
    to: node_modules/@bufbuild/protobuf
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  artifactName: ${productName}-Setup-${version}.exe
linux:
  target:
    - AppImage
    - deb
asarUnpack:
  - node_modules/@rahularya01/pi-cursor/**
npmRebuild: false
publish:
  provider: github
  owner: J3n5en
  repo: EnsoCode
  releaseType: draft
