appId: com.j3n5en.enso-code
productName: EnsoCode
directories:
  buildResources: build
extraResources:
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/icons/32x32.png
    to: tray-icon.png
  # Windows BrowserWindow/taskbar: multi-size ICO (BMP ≤128). PNG alone → square plate.
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon-win.png
    to: icon-win.png
files:
  - out/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # 动态 import，收集器可能漏掉；pnpm symlink 也要跟进拷进包
  - from: node_modules/@rahularya01/pi-cursor
    to: node_modules/@rahularya01/pi-cursor
  - from: node_modules/@bufbuild/protobuf
    to: node_modules/@bufbuild/protobuf
  - from: node_modules/quickjs-wasi
    to: node_modules/quickjs-wasi
  # node-datachannel 平台包是 optional 兄弟目录，收集器只打 JS；不显式拷贝则
  # require('@node-datachannel/<platform>') 在安装包里找不到（Windows 直连会降级中继）
  - from: node_modules/.pnpm/node-datachannel@0.33.2/node_modules/@node-datachannel
    to: node_modules/@node-datachannel
  # node-llama-cpp 平台预编译全部按需下载（含 CPU / Metal / CUDA / Vulkan）
  - '!node_modules/@node-llama-cpp/**'
  - '!node_modules/.pnpm/@node-llama-cpp+*/**'
  # renderer 已打进 out/；生产 node_modules 里这些是死重
  - '!**/*.map'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md}'
  - '!**/node_modules/**/{test,tests,__tests__,powered-test,example,examples,demo,docs}/**'
  - '!**/node_modules/**/*.{d.ts,d.mts,d.cts}'
  # getLlama({ build: 'never' })，源码 bundle 只给本机编译用
  - '!node_modules/node-llama-cpp/llama/gitRelease.bundle'
  # chord 只在 bundler 入口用 esbuild；agent-core 走 chord/context
  - '!node_modules/esbuild/**'
  - '!node_modules/@esbuild/**'
  - '!node_modules/.pnpm/esbuild@*/**'
  - '!node_modules/.pnpm/@esbuild+*/**'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  # 从未打 musl 目标；darwin/win/linux 预编译必须留在全局 files，不能放到 mac.files
  # —— 平台 files 若只含 !excludes，electron-builder 会当成默认 matcher 并塞入 **/*，整仓进 asar
  - '!node_modules/better-sqlite3/prebuilds/linuxmusl*'
  # pi TUI 剪贴板；loadClipboardNative 缺失即 null。产品剪贴板走 Electron
  - '!node_modules/@mariozechner/clipboard/**'
  - '!node_modules/@mariozechner/clipboard-*/**'
  - '!node_modules/.pnpm/@mariozechner+clipboard*/**'
electronLanguages:
  - en
  - en-US
  - zh
  - zh-CN
  - zh_CN
  - zh-TW
  - zh_TW
# sqlite-vec 是 dlopen 的动态库，留在 asar 内无法加载（db.ts 会回退到 app.asar.unpacked）
asarUnpack:
  - node_modules/sqlite-vec-*/**
  # onnxruntime-node 的 .node 绑定与 bin/ 下的 ORT 动态库同样不能从 asar 内加载（onnx.ts 动态 require）
  - node_modules/onnxruntime-node/**/*.node
  - node_modules/onnxruntime-node/bin/**
  # node-datachannel 平台预编译；asar 内 dlopen 失败
  - node_modules/@node-datachannel/**/*.node
  # ripgrep 二进制不能从 asar 内执行
  - node_modules/@vscode/ripgrep/bin/**
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  artifactName: ${productName}-Setup-${version}.exe
linux:
  target:
    - AppImage
    - deb
npmRebuild: false
# 聚合 hook 仍会先调用 src/tooling/stripPackagedNatives.mjs，再放入目标架构 RTK。
afterPack: ./scripts/after-pack.mjs
publish:
  provider: github
  owner: J3n5en
  repo: EnsoCode
  releaseType: draft
