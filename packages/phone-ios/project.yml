name: EnsoCodePhone
options:
  bundleIdPrefix: com.j3n5en.enso-code
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_BITCODE: NO
targets:
  EnsoCodePhone:
    type: application
    platform: iOS
    sources:
      - path: EnsoCodePhone
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j3n5en.enso-code.phone
        PRODUCT_NAME: EnsoCode
        PRODUCT_MODULE_NAME: EnsoCodePhone
        INFOPLIST_FILE: EnsoCodePhone/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: EnsoCode
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: EnsoCodePhone/EnsoCodePhone-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/EnsoCodePhone/Vendor"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: EnsoCodePhone/Info.plist
      properties:
        CFBundleDisplayName: EnsoCode
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 扫描桌面端配对二维码
        NSPhotoLibraryUsageDescription: 将图片发送到会话
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.j3n5en.enso-code.phone
            CFBundleURLSchemes:
              - enso
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
    preBuildScripts:
      - name: Embed git commit
        basedOnDependencyAnalysis: false
        script: |
          set -e
          HASH=$(git -C "${SRCROOT}/../.." rev-parse --short HEAD 2>/dev/null || echo dev)
          DIR="${SRCROOT}/EnsoCodePhone/Generated"
          mkdir -p "$DIR"
          printf 'enum AppVersion {\n  static let commit = "%s"\n}\n' "$HASH" > "$DIR/AppVersion.swift"
    scheme:
      testTargets:
        - EnsoCodePhoneTests
  EnsoCodePhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EnsoCodePhoneTests
    dependencies:
      - target: EnsoCodePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j3n5en.enso-code.phone.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EnsoCode.app/EnsoCode"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  EnsoCodePhone:
    build:
      targets:
        EnsoCodePhone: all
        EnsoCodePhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EnsoCodePhoneTests
    archive:
      config: Release
