<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#252529" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EnsoCode" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EnsoCode</title>
    <!--
      iOS 独立 PWA 只在启动时采样顶边定状态栏底色，之后不再重采：首帧前铺上次 renderer
      的边缘色（chrome.ts 写入，key 与格式同 DESK_CHROME_KEY），否则状态栏一直是启动画面的色。
    -->
    <script>
      (() => {
        try {
          const c = JSON.parse(localStorage.getItem('enso-desk-chrome') || 'null');
          const rgb = /^rgb\(\d{1,3}, \d{1,3}, \d{1,3}\)$/;
          if (!c || !rgb.test(c.top) || !rgb.test(c.bottom)) return;
          const style = document.documentElement.style;
          style.setProperty('--desk-top', c.top);
          style.setProperty('--desk-bottom', c.bottom);
          for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.remove();
          const meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = c.top;
          document.head.prepend(meta);
        } catch {}
      })();
    </script>
    <!-- 入口脚本 10s 没起跑：写明原因（SW 是否响应）再重载一次；重载也挂住时改提示划掉重开。逻辑同 launch.ts handleBootStuck -->
    <script>
      setTimeout(async () => {
        if (window.__deskBoot) return;
        const show = (t) => {
          const el = document.getElementById('splash-text');
          if (el) el.textContent = t;
        };
        const sw = navigator.serviceWorker?.controller;
        const swState = !sw
          ? '无 Service Worker'
          : await new Promise((resolve) => {
              const channel = new MessageChannel();
              const timer = setTimeout(() => resolve('Service Worker 无响应'), 2000);
              channel.port1.onmessage = () => {
                clearTimeout(timer);
                resolve('Service Worker 正常');
              };
              sw.postMessage({ type: 'desk-ping' }, [channel.port2]);
            });
        if (window.__deskBoot) return;
        const stage = `入口脚本没加载出来，${swState}`;
        const hint = '请从后台划掉 EnsoCode 再打开。';
        let retry = false;
        try {
          retry = !sessionStorage.getItem('enso-desk-boot-retry');
          if (retry) sessionStorage.setItem('enso-desk-boot-retry', '1');
        } catch {}
        if (!retry) {
          show(`启动卡住了（${stage}）。${hint}`);
          return;
        }
        show(`启动卡住（${stage}），正在重新加载…`);
        setTimeout(() => show(`重新加载也卡住了（${stage}）。${hint}`), 8000);
        // 这次先走网络取壳（sw.js shell-fresh），万一是缓存的壳本身有问题
        sw?.postMessage({ type: 'shell-fresh' });
        location.reload();
      }, 10000);
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background: var(--desk-top, #ffffff);
        color: #3f3f46;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html {
        background: var(--desk-bottom, #ffffff);
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: var(--desk-top, #252529);
          color: #d4d4d8;
        }
        html {
          background: var(--desk-bottom, #252529);
        }
      }
      #frames {
        position: fixed;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
      }
      /* 触屏键盘弹起（keyboard.ts）：界面贴着可见区，输入框贴键盘；键盘盖住 home 条，底部不再留安全区 */
      html.kb-open #frames {
        top: calc(var(--kb-top, 0px) + env(safe-area-inset-top));
        bottom: auto;
        height: calc(var(--kb-height, 100%) - env(safe-area-inset-top));
      }
      #frames iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
      #frames iframe.snapshot {
        z-index: 1;
        transition: opacity 0.2s ease-out;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      #splash a {
        color: #8ab4ff;
      }
      #status {
        position: fixed;
        z-index: 10;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 8px);
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 12px;
        display: none;
        pointer-events: none;
        white-space: nowrap;
        max-width: calc(100% - 32px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      html.kb-open #status {
        top: calc(var(--kb-top, 0px) + env(safe-area-inset-top) + 8px);
      }
    </style>
  </head>
  <body>
    <div id="frames"></div>
    <div id="splash"><div id="splash-text">正在连接桌面…</div></div>
    <div id="status"></div>
    <script type="module" src="/src/desk/main.ts"></script>
  </body>
</html>
