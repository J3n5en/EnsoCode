name: EnsoCode
options:
  bundleIdPrefix: com.j3n5en
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
packages:
  EnsoCore:
    path: .
targets:
  EnsoCode:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: WebApp
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: EnsoCore
        product: EnsoCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EnsoCode
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes:
              - enso
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: 用于扫描桌面端 EnsoCode 配对二维码
        NSLocalNetworkUsageDescription: 用于在局域网内与桌面端 EnsoCode 建立低延迟直连
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j3n5en.ensocode
        PRODUCT_NAME: EnsoCode
        DEVELOPMENT_TEAM: 69GW9UBCN2
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
